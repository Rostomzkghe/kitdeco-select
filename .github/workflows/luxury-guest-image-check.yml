name: Luxury Guest public image verification
on:
  push:
    branches: [luxury-guest-preview]
    paths: [.github/workflows/luxury-guest-image-check.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install browser verification tools
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium --only-shell
      - name: Check the published repaired snapshot on desktop and mobile
        run: |
          python maintenance/verify_images.py --url 'https://raw.githack.com/Rostomzkghe/kitdeco-select/1bd46154490eaa12232980894446236eeb7c29ee/' --out image-verification/public
      - name: Save actual public screenshots and verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luxury-guest-public-images-verified
          path: image-verification/
          retention-days: 7
