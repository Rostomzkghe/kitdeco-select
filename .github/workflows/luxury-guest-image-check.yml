name: Luxury Guest image check
on:
  push:
    branches: [luxury-guest-preview]
    paths: [.github/workflows/luxury-guest-image-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Install image decoder
        run: python -m pip install --quiet Pillow
      - name: Retrieve originals and prepare optimized website images
        shell: python
        run: |
          import urllib.request, json, pathlib, io, hashlib, shutil
          from PIL import Image, ImageOps
          out = pathlib.Path('image-recovery')
          out.mkdir(exist_ok=True)
          site = out / 'site'
          site.mkdir(exist_ok=True)
          for path in pathlib.Path('.').iterdir():
            if path.name.startswith('.') or path.name == out.name:
              continue
            if path.is_file() and path.suffix in ['.html', '.js', '.css', '.md', '.txt', '.toml']:
              shutil.copy2(path, site / path.name)
          shutil.copytree('assets', site / 'assets', dirs_exist_ok=True)
          images = site / 'assets' / 'photos'
          images.mkdir(exist_ok=True)
          urls = {
            'bateau-en-famille': 'https://ik.imagekit.io/Fibonacci/bateau%20en%20famille.jpg?tr=orig-true',
            'destinations-aube': 'https://ik.imagekit.io/Fibonacci/san-diego-dawn-early-morning-with-palm-tree-silhouette.jpg?tr=orig-true'
          }
          report = []
          for name, url in urls.items():
            request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 LuxuryGuestImageRecovery/1.0'})
            with urllib.request.urlopen(request, timeout=40) as response:
              assert response.status == 200 and response.headers.get('Content-Type', '').startswith('image/'), 'Source is not a successful image response'
              raw = response.read(30_000_000)
              original = Image.open(io.BytesIO(raw))
              original.load()
              original = ImageOps.exif_transpose(original).convert('RGB')
              item = {'name': name, 'source': url, 'status': response.status, 'original_size': list(original.size), 'source_bytes': len(raw), 'source_sha256': hashlib.sha256(raw).hexdigest(), 'outputs': []}
              for width in ([600, 1200] if name == 'bateau-en-famille' else [960, 1920]):
                resized = original.copy()
                resized.thumbnail((width, width), Image.Resampling.LANCZOS)
                output = images / (name + '-' + str(width) + '.webp')
                resized.save(output, 'WEBP', quality=84, method=6)
                item['outputs'].append({'path': str(output.relative_to(site)), 'dimensions': list(resized.size), 'bytes': output.stat().st_size})
              report.append(item)
              print(json.dumps(item, ensure_ascii=False), flush=True)
          (out / 'report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2))
      - name: Save source package and recovered optimized photographs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luxury-guest-image-recovery
          path: image-recovery/
          retention-days: 2
