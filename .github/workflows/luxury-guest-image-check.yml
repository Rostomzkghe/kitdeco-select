name: Luxury Guest image check
on:
  push:
    branches: [luxury-guest-preview]
    paths: [.github/workflows/luxury-guest-image-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect the two client image URLs and preview headers
        shell: python
        run: |
          import urllib.request, urllib.error, json, os, pathlib
          out = pathlib.Path('image-diagnostic')
          out.mkdir(exist_ok=True)
          urls = {
            'boat': 'https://ik.imagekit.io/Fibonacci/bateau%20en%20famille.jpg',
            'destinations': 'https://ik.imagekit.io/Fibonacci/san-diego-dawn-early-morning-with-palm-tree-silhouette.jpg',
            'preview': 'https://raw.githack.com/Rostomzkghe/kitdeco-select/8cc848deaeba17ec77353a49de5106a688382d0f/index.html'
          }
          report = []
          for name, url in urls.items():
            for referer in (['', 'https://raw.githack.com/'] if name != 'preview' else ['']):
              headers = {'User-Agent': 'Mozilla/5.0 LuxuryGuestImageCheck/1.0'}
              if referer:
                headers['Referer'] = referer
              item = {'name': name, 'url': url, 'referer': referer}
              try:
                with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=25) as response:
                  content = response.read(20_000_000)
                  item.update(status=response.status, headers=dict(response.headers), bytes=len(content), final_url=response.url)
                  if response.headers.get('Content-Type', '').startswith('image/'):
                    (out / (name + '.jpg')).write_bytes(content)
                    item['magic'] = content[:16].hex()
                  else:
                    item['body'] = content[:2500].decode('utf-8', errors='replace')
              except urllib.error.HTTPError as error:
                item.update(status=error.code, headers=dict(error.headers), body=error.read(2500).decode('utf-8', errors='replace'))
              except Exception as error:
                item.update(error=str(error))
              report.append(item)
              print(json.dumps(item, ensure_ascii=False), flush=True)
          (out / 'report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2))
      - name: Save diagnostic and retrievable source images
        uses: actions/upload-artifact@v4
        with:
          name: luxury-guest-image-diagnostic
          path: image-diagnostic/
          retention-days: 2
